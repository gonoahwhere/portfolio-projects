name: knowah
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  fonts:
    - family: RubikDirt
      fonts:
        - asset: fonts/RubikDirt-Regular.ttf
    - family: Sniglet
      fonts:
        - asset: fonts/Sniglet-Regular.ttf

